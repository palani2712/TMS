# Server Configuration
server.port=8080

# Spring Application Name
spring.application.name=todowebapp

# ==========================================
# DATABASE CONFIGURATION
# ==========================================
# MySQL Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/tododb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:rotated_password}


# JPA Common Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# SECURITY & JWT CONFIGURATION
# ==========================================
# Secret key should be a base64-encoded string of at least 256 bits (32 bytes)
app.jwt.secret=rotated_jwt_secret
app.jwt.expiration-ms=86400000

# File Upload / Multipart Settings
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Error details in API responses for debugging
server.error.include-message=always
server.error.include-exception=true
server.error.include-stacktrace=always


# ==========================================
# MAIL / SMTP CONFIGURATION
# ==========================================
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:credtrust.launchpad@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:vhkokvdcbocpwhcn}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000


