# Server Configuration
server.port=8080

# Spring Application Name
spring.application.name=todowebapp

# ==========================================
# DATABASE CONFIGURATION
# ==========================================
# MySQL Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/tododb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}


# JPA Common Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ==========================================
# SECURITY & JWT CONFIGURATION
# ==========================================
# Secret key should be a base64-encoded string of at least 256 bits (32 bytes)
app.jwt.secret=${APP_JWT_SECRET:d3b07384d113edec49eaa6238ad5ff0026e6dcfcf61af3b02131e5fdfa5d12ef}
app.jwt.expiration-ms=86400000

# File Upload / Multipart Settings
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Error details in API responses for debugging
server.error.include-message=never
server.error.include-exception=false
server.error.include-stacktrace=never


# ==========================================
# MAIL / SMTP CONFIGURATION
# ==========================================
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:your-gmail-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000


